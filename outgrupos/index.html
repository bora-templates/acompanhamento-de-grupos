<!doctype html>
<!--
  GRUPOS (/outgrupos/): Acompanhamento de Grupos no WhatsApp com IA.
  A pessoa liga o WhatsApp, escolhe os grupos e a IA conta o que aconteceu em cada um, aponta o que
  ficou pendente e responde perguntas sobre o grupo.

  Esta página é só a casca: menu, topo e os lugares onde cada tela entra. O desenho de cada tela
  está em index-partes/telas/ e a montagem do site encaixa tudo aqui, no lugar de cada pedaço marcado.
  Mapa do código: index-partes/LEIA-ME.md. Visual: outgrupos.css.
  Banco: funções hub.og_* (outgrupos/banco). Servidor: Edge Function og-api (a IA, a uazapi e os
  segredos moram lá: nenhuma chave chega a esta tela).
-->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento de Grupos no WhatsApp com IA</title>
<link rel="icon" href="/outgrupos/img/outgrupos-marca.svg">
<link rel="stylesheet" href="/outgrupos/outgrupos.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>window.OS_NO_BACK = true;   // o menu já tem "Início"; o botão flutuante de voltar cobriria o pé do menu</script>
<script src="/shared/os-core.js"></script>
<script src="/outgrupos/index-partes/js/01-base.js?v=1"></script>
<script src="/outgrupos/index-partes/js/02-grupos.js?v=1"></script>
<script src="/outgrupos/index-partes/js/03-grupo.js?v=1"></script>
<script src="/outgrupos/index-partes/js/04-resumos.js?v=1"></script>
<script src="/outgrupos/index-partes/js/05-extras.js?v=1"></script>
<script src="/outgrupos/index-partes/js/06-ajustes.js?v=1"></script>
<script src="/outgrupos/index-partes/js/99-monta.js?v=1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
<div id="og-app" class="app" x-data="ogApp()" :class="{ 'menu-aberto': menuAberto }" @keydown.escape.window="fechaJanelas()" style="display:none">

  <!-- carregando por cima da tela, só para o que trava tudo por alguns segundos -->
  <div class="overlay" x-show="tarefa" x-cloak role="status" aria-live="polite"><div class="box"><span class="spin"></span><span x-text="tarefa"></span></div></div>

  <!-- aviso curto que sobe na tela -->
  <div class="toast" :class="aviso.tom" x-show="aviso.texto" x-cloak role="status" aria-live="polite"><span x-text="aviso.texto"></span></div>

  <!-- ═══ MENU ═══ -->
  <div class="menu-fundo" @click="menuAberto = false"></div>
  <aside class="side">
    <div class="marca">
      <svg viewBox="0 0 52 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#F5F7FB"/><path d="M30 2a13 13 0 0 1 0 26z" fill="#A7CEE5"/><path d="M33 9h8.5a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H38l-3 3v-3h-2a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 33 9z" fill="none" stroke="#00133D" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div><b>Grupos</b><small>WhatsApp com IA</small></div>
    </div>
    <nav class="nav" aria-label="Menu do módulo">
      <div class="nav-rot">Acompanhamento</div>
      <a class="nav-item" href="#grupos" :class="{ ativo: rota === 'grupos' || rota === 'grupo' }" :aria-current="(rota === 'grupos' || rota === 'grupo') ? 'page' : null">
        <svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Grupos</a>
      <a class="nav-item" href="#ajustes" x-show="podeConfigurar" x-cloak :class="{ ativo: rota === 'ajustes' }" :aria-current="rota === 'ajustes' ? 'page' : null">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Ajustes</a>
      <div class="nav-rot">Sistema</div>
      <a class="nav-item" href="/"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Início</a>
    </nav>
    <div class="pe" x-show="eu" x-cloak>
      <span class="avatar" :style="eu && eu.foto ? 'background-image:url(\'' + String(eu.foto).replace(/'/g, '%27') + '\')' : ''" x-text="eu && eu.foto ? '' : iniciais(eu && eu.nome)"></span>
      <div style="min-width:0"><b x-text="eu && eu.nome"></b><small x-text="papelTexto"></small></div>
    </div>
  </aside>

  <main class="main">
    <div class="faixa"></div>
    <header class="topo">
      <button type="button" class="circ hamb" @click="menuAberto = !menuAberto" aria-label="Abrir o menu">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <span class="crumb">Grupos<template x-if="tituloRota"><span> · <span x-text="tituloRota"></span></span></template></span>
      <span class="esp"></span>
      <button type="button" class="circ" @click="trocaTema()" :title="tema === 'dark' ? 'Mudar para o Dia' : 'Mudar para a Noite'" :aria-label="tema === 'dark' ? 'Mudar para o Dia' : 'Mudar para a Noite'">
        <svg class="i" viewBox="0 0 24 24" x-show="tema === 'dark'"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i" viewBox="0 0 24 24" x-show="tema !== 'dark'"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </header>

    <div class="pg">
      <div class="err" x-show="erro" x-cloak role="alert"><span x-text="erro"></span> <button type="button" class="lnk" @click="erro = ''">Fechar</button></div>

      <div data-parte="/outgrupos/index-partes/telas/grupos.html"></div>
      <div data-parte="/outgrupos/index-partes/telas/grupo.html"></div>
      <div data-parte="/outgrupos/index-partes/telas/ajustes.html"></div>
    </div>
  </main>

  <div data-parte="/outgrupos/index-partes/telas/janelas.html"></div>
</div>
</body>
</html>
