<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícone do app: o mesmo desenho do favicon.svg (quadrado carvão com o sinal em terracota), em tela cheia e sem
       cantos, porque o iPhone e o Android arredondam sozinhos. O sinal fica dentro da área segura do ícone que se adapta
       ao formato do aparelho (os 80% do meio). Os PNG (icon-180, icon-192 e icon-512) saem deste arquivo. -->
  <rect width="1024" height="1024" fill="#1D1A17"/>
  <rect x="320" y="384" width="352" height="352" rx="100" fill="#E8703A"/>
  <circle cx="684" cy="372" r="86" fill="#FFF8F1" stroke="#1D1A17" stroke-width="48"/>
</svg>
