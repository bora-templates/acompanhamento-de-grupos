<!doctype html>
<!--
  NOVIDADES DO HUB  (/novidades/)
  ─────────────────────────────────────────────────────────────────────────────
  Mural do que foi liberado em cada hub, dia a dia (tabela hub.novidades).
  O que está EM CONSTRUÇÃO cada um escreve aqui.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novidades — Hub</title>
<link rel="icon" href="/shared/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#F5F6F8;--card:#fff;--bd:#E6E8EC;--ink:#101114;--mut:#6B7280;
        --acc:#1C3E87;--azul:#00133D;--claro:#9CB2D4;--ok:#1a7f4b;--danger:#b42318}
  body{font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  [x-cloak]{display:none!important}
  .wrap{max-width:900px;margin:0 auto;padding:32px 22px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--mut)}
  .brand a{color:var(--acc);text-decoration:none}
  /* ✕ fechar, no alto à direita — volta pro Hub */
  .fechar{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);
          color:var(--mut);font-size:17px;line-height:1;cursor:pointer;display:flex;
          align-items:center;justify-content:center;text-decoration:none;flex:none}
  .fechar:hover{background:#EDF1F9;color:var(--acc);border-color:var(--claro)}
  h1{font-size:24px;font-weight:800;margin:6px 0 2px}
  .sub{color:var(--mut);font-size:13.5px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.6;cursor:default}
  .btn.ghost{background:none;border:1px solid var(--bd);color:var(--ink)}
  .btn.mini{padding:5px 10px;font-size:12px;border-radius:7px}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--ink);outline:none;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  .err{color:var(--danger);font-size:13px}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

  /* Dia */
  .dia{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  .dia b{font-size:13px;font-weight:800;color:var(--azul);letter-spacing:.3px}
  .dia .risco{flex:1;height:1px;background:var(--bd)}
  .dia .hoje{background:var(--acc);color:#fff;font-size:10.5px;font-weight:800;
             padding:2px 8px;border-radius:99px;letter-spacing:.4px}

  /* Item da lista */
  .item{display:flex;gap:12px;align-items:flex-start;background:var(--card);
        border:1px solid var(--bd);border-left:3px solid var(--acc);
        border-radius:12px;padding:13px 15px;margin-bottom:8px}
  .item .txt{flex:1;min-width:0}
  .item .tit{font-size:14px;font-weight:600;line-height:1.4}
  .item .pe{margin-top:5px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hub{display:inline-block;background:#EDF1F9;color:var(--acc);font-size:11px;font-weight:800;
       padding:3px 9px;border-radius:99px;letter-spacing:.3px}
  .item a.ver{color:var(--acc);text-decoration:none;font-weight:600;font-size:12.5px;white-space:nowrap}
  .item a.ver:hover{text-decoration:underline}

  /* Rostinho */
  .avatar{width:30px;height:30px;border-radius:50%;flex:none;background-size:cover;background-position:center;
          background-color:var(--claro);color:var(--azul);font-size:11px;font-weight:800;
          display:flex;align-items:center;justify-content:center;letter-spacing:.3px}

  /* Em construção */
  .obras{border-left-color:var(--claro);background:#FBFCFE}
  .obras .tit{font-weight:500}
  .secao{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:26px 0 10px}
  .form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
  .form .f{flex:1;min-width:150px}
  .form label{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin-bottom:4px}
  .vazio{color:var(--mut);font-size:13.5px;padding:18px;text-align:center;
         background:var(--card);border:1px dashed var(--bd);border-radius:12px}
  .mais{display:flex;justify-content:center;margin-top:18px}

  .overlay{position:fixed;inset:0;background:rgba(16,17,20,.42);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999}
  .overlay .box{background:#fff;border-radius:14px;padding:22px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);font-size:14px;font-weight:600}
  .spin{width:24px;height:24px;border:3px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:620px){ .wrap{padding:20px 14px 50px} h1{font-size:20px} }
</style>
</head>
<body>

<div x-data="novidades()" x-cloak>

  <div class="overlay" x-show="busy" x-cloak>
    <div class="box"><span class="spin"></span> <span x-text="busyMsg"></span></div>
  </div>

  <!-- Sem login: manda pra porta de entrada do Hub -->
  <div class="gate" x-show="ready && !authed">
    <div class="card" style="max-width:360px">
      <h1>Acesso restrito</h1>
      <p class="sub" style="margin:8px 0 16px">Entre pelo Hub para abrir esta tela.</p>
      <a class="btn" href="/">Ir para o login</a>
    </div>
  </div>

  <div class="wrap" x-show="authed">
    <header class="top">
      <div class="brand"><a href="/">← Hub</a></div>
      <a class="fechar" href="/" title="Fechar" aria-label="Fechar">✕</a>
    </header>

    <h1>Novidades</h1>
    <p class="sub">Tudo que foi liberado nos hubs, dia a dia.</p>

    <div x-show="erro" class="err" style="margin-bottom:12px" x-text="erro"></div>

    <!-- ── EM CONSTRUÇÃO ────────────────────────────────────────────── -->
    <div class="secao">🚧 Em construção — o que está vindo</div>

    <template x-for="o in obras" :key="o.id">
      <div class="item obras">
        <div class="avatar" :style="fundo(o)" x-text="foto(o) ? '' : iniciais(nome(o))"></div>
        <div class="txt">
          <div class="tit" x-text="o.titulo"></div>
          <div class="pe">
            <span class="hub" x-text="o.sistema"></span>
            <span x-text="nome(o)"></span>
            <template x-if="o.autor_id === meuId">
              <button class="btn ghost mini" @click="apagar(o)">remover</button>
            </template>
          </div>
        </div>
      </div>
    </template>
    <template x-if="!busy && obras.length === 0">
      <div class="vazio">Nada marcado como em construção agora.</div>
    </template>

    <div class="card" style="margin-top:12px">
      <div style="font-size:13px;font-weight:700">Avisar o time do que está vindo</div>
      <div class="form">
        <div class="f" style="max-width:190px">
          <label>Hub</label>
          <select x-model="novo.sistema">
            <template x-for="h in HUBS" :key="h"><option x-text="h" :value="h"></option></template>
          </select>
        </div>
        <div class="f" style="min-width:240px">
          <label>O que está sendo feito</label>
          <input x-model="novo.titulo" placeholder="Ex.: Kanban de cobrança com dossiê jurídico"
                 @keydown.enter="adicionar()">
        </div>
        <button class="btn" @click="adicionar()" :disabled="!novo.titulo.trim()">Adicionar</button>
      </div>
    </div>

    <!-- ── LIBERADO, POR DIA ────────────────────────────────────────── -->
    <div class="secao" style="margin-top:34px">✅ Já no ar</div>

    <template x-for="g in porDia" :key="g.dia">
      <div>
        <div class="dia">
          <b x-text="dataLonga(g.dia)"></b>
          <template x-if="g.dia === hoje"><span class="hoje">HOJE</span></template>
          <span class="risco"></span>
        </div>
        <template x-for="n in g.itens" :key="n.id">
          <div class="item">
            <div class="avatar" :style="fundo(n)" x-text="foto(n) ? '' : iniciais(nome(n))"></div>
            <div class="txt">
              <div class="tit" x-text="n.titulo"></div>
              <div class="pe">
                <span class="hub" x-text="n.sistema"></span>
                <span x-text="nome(n)"></span>
                <template x-if="n.versao"><span x-text="'v' + n.versao"></span></template>
              </div>
            </div>
            <template x-if="n.link"><a class="ver" :href="n.link">abrir →</a></template>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!busy && porDia.length === 0">
      <div class="vazio">Ainda não há novidades registradas.</div>
    </template>

    <div class="mais" x-show="carregadas < total">
      <button class="btn ghost" @click="carregarMais()">
        Ver mais (<span x-text="total - carregadas"></span> anteriores)
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/shared/os-core.js"></script>
<script>
  function novidades() {
    const PAGINA = 30;   // quantas entregas por vez (pagina no banco)

    return {
      ready:false, authed:false, busy:false, busyMsg:'Carregando…', erro:'',
      HUBS:['OutJourney','OutChat','OutFunnels','OutProjetos','OutSign','OutPeople',
            'OutPerformance','Produtos','Financeiro','OutProcessos','Hub'],
      liberadas:[], obras:[], pessoas:{}, total:0, carregadas:0,
      meuId:null, meuNome:'',
      novo:{ sistema:'OutJourney', titulo:'' },
      hoje:new Date().toLocaleDateString('sv-SE'),   // AAAA-MM-DD no fuso de quem lê

      async init(){
        try{
          const session = (window.OS && window.OS.Auth) ? await OS.Auth.getSession() : null;
          this.authed = !!session;
          if (session) {
            this.meuId = session.user.id;
            const p = await OS.getMyProfile();
            this.meuNome = (p && (p.full_name || p.email)) || '';
          }
        }catch(e){ this.authed = false; }
        this.ready = true;
        if (this.authed) await this.carregar();
      },

      // Agrupa por dia só o que já veio do banco (a paginação é lá).
      get porDia(){
        const mapa = [];
        for (const n of this.liberadas){
          let g = mapa.find(x => x.dia === n.dia);
          if (!g) { g = { dia:n.dia, itens:[] }; mapa.push(g); }
          g.itens.push(n);
        }
        return mapa;
      },

      async carregar(){
        this.busy = true; this.busyMsg = 'Carregando…'; this.erro = '';
        try{
          const sb = OS.getClient();

          // Quem é quem (tabela pequena, cabe inteira)
          const { data:us } = await sb.from('users').select('id,full_name,avatar_url');
          (us||[]).forEach(u => { this.pessoas[u.id] = u;
                                  if (u.full_name) this.pessoas[u.full_name.toLowerCase()] = u; });

          // O que está em construção (poucas linhas, sem paginação)
          const { data:ob, error:e1 } = await sb.from('novidades')
            .select('*').eq('status','construcao').order('criado_em',{ascending:false});
          if (e1) throw e1;
          this.obras = ob || [];

          this.liberadas = []; this.carregadas = 0;
          await this.carregarMais();
        }catch(e){
          this.erro = 'Não consegui carregar as novidades: ' + (e.message || e);
        }finally{ this.busy = false; }
      },

      async carregarMais(){
        this.busy = true; this.busyMsg = 'Carregando…';
        try{
          const de = this.carregadas, ate = this.carregadas + PAGINA - 1;
          const { data, count, error } = await OS.getClient().from('novidades')
            .select('*', { count:'exact' })
            .eq('status','liberado')
            .order('dia',{ascending:false}).order('criado_em',{ascending:false})
            .range(de, ate);
          if (error) throw error;
          this.liberadas = this.liberadas.concat(data || []);
          this.carregadas = this.liberadas.length;
          this.total = count || this.carregadas;
        }catch(e){
          this.erro = 'Não consegui carregar as novidades: ' + (e.message || e);
        }finally{ this.busy = false; }
      },

      async adicionar(){
        const titulo = this.novo.titulo.trim();
        if (!titulo) return;
        this.busy = true; this.busyMsg = 'Salvando…'; this.erro = '';
        try{
          const { error } = await OS.getClient().from('novidades').insert({
            status:'construcao', sistema:this.novo.sistema, titulo,
            autor:this.meuNome, autor_id:this.meuId
          });
          if (error) throw error;
          this.novo.titulo = '';
          const { data } = await OS.getClient().from('novidades')
            .select('*').eq('status','construcao').order('criado_em',{ascending:false});
          this.obras = data || [];
        }catch(e){
          this.erro = 'Não consegui salvar: ' + (e.message || e); alert(this.erro);
        }finally{ this.busy = false; }
      },

      async apagar(o){
        if (!confirm('Tirar "' + o.titulo + '" da lista de em construção?')) return;
        this.busy = true; this.busyMsg = 'Removendo…'; this.erro = '';
        try{
          const { error } = await OS.getClient().from('novidades').delete().eq('id', o.id);
          if (error) throw error;
          this.obras = this.obras.filter(x => x.id !== o.id);
        }catch(e){
          this.erro = 'Não consegui remover: ' + (e.message || e); alert(this.erro);
        }finally{ this.busy = false; }
      },

      // ── Rostinho e nome de quem entregou ──
      pessoa(n){
        return this.pessoas[n.autor_id]
            || this.pessoas[(n.autor || '').toLowerCase()]
            || null;
      },
      nome(n){ const p = this.pessoa(n); return (p && p.full_name) || n.autor || 'Hub'; },
      foto(n){ const p = this.pessoa(n); return (p && p.avatar_url) || ''; },
      fundo(n){ const f = this.foto(n); return f ? `background-image:url('${f}')` : ''; },
      iniciais(nome){
        const p = (nome||'').trim().split(/\s+/).filter(Boolean);
        if (!p.length) return '··';
        return ((p[0][0]||'') + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase();
      },

      dataLonga(d){
        const [a,m,dd] = (d||'').split('-').map(Number);
        if (!a) return d;
        const dt = new Date(a, m-1, dd);
        const s = dt.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
        return s.charAt(0).toUpperCase() + s.slice(1);
      },
    };
  }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
