<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · %EMPRESA_NOME%</title>
<link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
<!--
  A PORTA DE ENTRADA (login único). No pacote completo, é também a tela inicial do sistema.
  No pacote de uma solução (pacote avulso), esta página é só o login: depois dele, a pessoa vai direto para a
  solução (/shared/entrada.js), e os arquivos da tela inicial nem vão no pacote.
-->
<link rel="stylesheet" href="/shared/visual/tokens.css">
<link rel="stylesheet" href="/shared/visual/componentes.css">
<link rel="stylesheet" href="/shared/visual/entrada.css">
<script>
  // a porta de entrada do pacote de uma solução é só o login: sem sino e sem o botão flutuante do assistente
  window.OS_NO_DESK = true;
  window.OS_AGENTE_SEM_BOTAO = true;
</script>
</head>
<body>

<!-- carregando -->
<div class="overlay" id="overlay"><div class="box"><span class="spin"></span> <span id="overlayMsg">Carregando</span></div></div>

<!-- ENTRADA (login único do sistema) -->
<main class="gate" id="gate" hidden>
  <form class="gate-card" id="loginForm">
    <span class="v-marca"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="20" width="28" height="28" rx="8" fill="#E8703A"/><circle cx="45" cy="19" r="7" fill="#FFF8F1"/></svg></span>
    <h1>Entrar</h1>
    <p class="v-sub" id="gateEmpresa">%EMPRESA_NOME%</p>
    <p class="v-sub entrada-solucao" id="gateSolucao" hidden></p>
    <div class="v-campos">
      <div><label class="v-rotulo" for="email">E-mail</label><input class="v-campo" id="email" type="email" autocomplete="email" placeholder="voce@empresa.com.br" required></div>
      <div><label class="v-rotulo" for="pass">Senha</label><input class="v-campo" id="pass" type="password" autocomplete="current-password" placeholder="Digite a sua senha" required></div>
      <button class="v-btn v-btn--bloco" id="loginBtn" type="submit">Entrar</button>
    </div>
    <p class="v-ajuda v-ajuda--erro" id="loginErr" role="alert"></p>
    <!-- Recuperar/definir senha: link por e-mail que abre em /entrar/ -->
    <button type="button" class="esqueci" id="forgotLink">Esqueci minha senha</button>
    <p class="v-ajuda" id="recoverMsg" role="status"></p>
  </form>
</main>

<!-- quem entrou mas não tem a chave da solução: diz isso e a quem pedir, sem mandar para outra tela (entrada.js) -->
<main class="gate" id="semAcesso" hidden>
  <div class="gate-card">
    <span class="v-marca" id="semAcessoMarca"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="20" width="28" height="28" rx="8" fill="#E8703A"/><circle cx="45" cy="19" r="7" fill="#FFF8F1"/></svg></span>
    <h1 id="semAcessoTitulo">Você ainda não tem acesso</h1>
    <p class="v-sub" id="semAcessoTexto">Quem administra o sistema da empresa libera o acesso na tela Usuários.</p>
    <div class="v-campos">
      <a class="v-btn v-btn--bloco" id="semAcessoUsuarios" href="/usuarios/" hidden>Abrir Usuários</a>
      <button class="v-btn v-btn--sec v-btn--bloco" type="button" id="semAcessoSair">Sair</button>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/shared/os-core.js"></script>
<script src="/shared/entrada.js"></script>
</body>
</html>
