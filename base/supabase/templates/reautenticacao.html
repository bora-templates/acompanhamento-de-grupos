<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>%EMPRESA_NOME%</title></head>
<!--
  Modelo do e-mail "Reautenticação (Reauthentication)" do login (Supabase Auth), em português.
  Assunto sugerido: Seu código de confirmação — %EMPRESA_NOME%
  %EMPRESA_NOME% = o nome da empresa (troque antes de colar no painel do Supabase;
  ver "Os e-mails do login em português" no base/README.md).
  O que está entre chaves duplas (o link de confirmação, o código, o e-mail) é
  preenchido pelo próprio Supabase: deixe como está.
-->
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1d2330">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e3e6ec;border-radius:14px">
        <tr><td style="padding:28px 32px 8px;font-size:13px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;color:#5b6475">%EMPRESA_NOME%</td></tr>
        <tr><td style="padding:4px 32px 0;font-size:22px;font-weight:bold;line-height:1.3">Seu código de confirmação</td></tr>
        <tr><td style="padding:14px 32px 0;font-size:15px;line-height:1.6;color:#3a4252">Para confirmar esta ação na sua conta do %EMPRESA_NOME%, digite o código abaixo na tela que pediu.</td></tr>
        <tr><td style="padding:24px 32px 8px"><div style="display:inline-block;font-size:28px;font-weight:bold;letter-spacing:.2em;background:#f4f5f7;border:1px solid #e3e6ec;border-radius:10px;padding:12px 20px">{{ .Token }}</div></td></tr>
        <tr><td style="padding:8px 32px 0;font-size:13px;line-height:1.6;color:#5b6475">O código vale por pouco tempo.</td></tr>
        <tr><td style="padding:20px 32px 28px;font-size:12px;line-height:1.6;color:#8a93a5">Se você não esperava este e-mail, pode ignorar: nada muda na sua conta.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
